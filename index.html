<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root {
            --excel-green: #217346;
            --excel-dark: #103822;
            --danger: #ff4757;
            --gold: #ffa502;
            --bg: #0d1117;
            --cell-bg: rgba(255, 255, 255, 0.05);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background-color: var(--bg);
            color: #fff; margin: 0; padding: 10px;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; touch-action: manipulation;
        }

        /* واجهة HUD */
        .hud {
            width: 100%; max-width: 600px;
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 20px; background: rgba(255,255,255,0.05);
            border-radius: 12px; margin-bottom: 10px; border: 1px solid rgba(255,255,255,0.1);
        }

        .hud-item { font-weight: bold; font-size: clamp(14px, 4vw, 18px); }
        .life { color: var(--danger); }
        .stage { color: var(--gold); }

        /* البطاقة المركزية */
        .display-card {
            width: 100%; max-width: 600px;
            background: linear-gradient(145deg, var(--excel-green), var(--excel-dark));
            padding: 20px; border-radius: 18px; text-align: center;
            box-shadow: 0 15px 40px rgba(0,0,0,0.5); margin-bottom: 15px;
            position: relative; border: 1px solid rgba(255,255,255,0.2);
        }

        .label { font-size: 14px; opacity: 0.8; margin-bottom: 5px; }
        .target-id { font-size: clamp(40px, 15vw, 70px); font-weight: 900; text-shadow: 0 4px 15px rgba(0,0,0,0.4); }

        #timer-wrap { width: 100%; height: 6px; background: rgba(0,0,0,0.3); border-radius: 3px; overflow: hidden; margin-top: 15px; visibility: hidden; }
        #timer-bar { width: 100%; height: 100%; background: var(--gold); transition: linear; }

        /* الشبكة المتناسقة تماماً */
        .grid-wrapper { width: 100%; max-width: 600px; overflow-x: auto; padding: 5px; }
        .grid {
            display: grid;
            grid-template-columns: 45px repeat(6, 1fr);
            gap: 2px; width: 100%; background: rgba(255,255,255,0.05);
            padding: 4px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1);
            min-width: 300px;
        }

        .cell {
            aspect-ratio: 1; display: flex; justify-content: center; align-items: center;
            background: var(--cell-bg); font-weight: bold;
            font-size: clamp(14px, 4vw, 20px); cursor: pointer; transition: 0.15s;
            border-radius: 2px;
        }

        .cell:hover:not(.header) { background: rgba(255,255,255,0.1); }
        .cell.header { background: rgba(255,255,255,0.15); color: var(--gold); cursor: default; }
        .cell.active-h { background: var(--excel-green) !important; color: white; }

        /* نظام التقاطع الأحمر عند الفشل */
        .fail-intersection { background: rgba(255, 71, 87, 0.3) !important; }
        .fail-target { background: var(--danger) !important; color: white !important; animation: blink 0.3s infinite; }
        .fail-header { background: var(--danger) !important; color: white !important; }

        @keyframes blink { 50% { opacity: 0.5; } }

        /* الشاشات الإضافية */
        .overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.95);
            display: flex; flex-direction: column; justify-content: center;
            align-items: center; z-index: 10000; text-align: center;
        }

        .count-text { font-size: 150px; font-weight: 900; color: var(--gold); }

        .btn-group { display: flex; gap: 10px; margin-bottom: 15px; }
        .btn {
            padding: 10px 20px; border: none; border-radius: 8px; font-weight: bold;
            cursor: pointer; transition: 0.3s; background: rgba(255,255,255,0.1); color: #ccc;
        }
        .btn.active { background: var(--excel-green); color: white; box-shadow: 0 4px 15px rgba(33, 115, 70, 0.4); }

        .hidden { display: none !important; }
        @keyframes shake { 0%, 100% { transform: translate(0); } 25% { transform: translate(-10px); } 75% { transform: translate(10px); } }
        .shake { animation: shake 0.1s ease-in-out 2; }
    </style>
</head>
<body onclick="setupAudio()">

    <div class="btn-group">
        <button id="btn-train" class="btn active" onclick="setMode('train')">📖 وضع الاستكشاف</button>
        <button id="btn-quiz" class="btn" onclick="setMode('quiz')">🎯 تحدي الأبطال</button>
    </div>

    <div id="quiz-hud" class="hud" style="visibility: hidden;">
        <div class="hud-item stage">المرحلة: <span id="stage-num">1</span>/3</div>
        <div class="hud-item life">❤️ قلب واحد</div>
    </div>

    <div class="display-card" id="main-card">
        <div id="status-label" class="label">مرر الفأرة فوق الخلايا</div>
        <div id="target-view" class="target-id">--</div>
        <div id="timer-wrap"><div id="timer-bar"></div></div>
    </div>

    <div class="grid-wrapper">
        <div class="grid" id="excel-grid"></div>
    </div>

    <div id="count-overlay" class="overlay hidden">
        <div class="count-text" id="count-display">3</div>
        <p style="font-size: 24px;">استعد للهجوم...</p>
    </div>

    <div id="end-overlay" class="overlay hidden">
        <h1 id="end-title" style="font-size: 40px;"></h1>
        <p id="end-desc" style="font-size: 20px; opacity: 0.8;"></p>
        <button class="btn active" style="padding: 15px 50px; margin-top: 20px;" onclick="location.reload()">الطالب التالي 👤</button>
    </div>

    <script>
        let audioCtx = null;
        const columns = ['', 'A', 'B', 'C', 'D', 'E', 'F'];
        const rowsCount = 6;
        let mode = 'train', stage = 1, targetId = '', timer = null;
        const cellRefs = {};

        function setupAudio() {
            if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if(audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playSfx(freqs, type='square', vol=0.07, dur=0.1) {
            if(!audioCtx) return;
            let t = audioCtx.currentTime;
            freqs.forEach(f => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type; osc.frequency.setValueAtTime(f, t);
                gain.gain.setValueAtTime(vol, t);
                gain.gain.exponentialRampToValueAtTime(0.01, t + dur);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(t); osc.stop(t + dur);
                t += dur * 0.8;
            });
        }

        const audio = {
            hover: () => playSfx([600], 'sine', 0.02, 0.05),
            click: () => playSfx([800], 'sine', 0.04, 0.08),
            count: () => playSfx([440], 'square', 0.05, 0.1),
            go: () => playSfx([880, 1100], 'square', 0.08, 0.2),
            win: () => playSfx([523, 659, 783, 1046, 1318], 'square', 0.1, 0.15),
            fail: () => playSfx([493, 392, 349, 329, 293, 261], 'square', 0.1, 0.25)
        };

        function buildGrid() {
            const grid = document.getElementById('excel-grid');
            grid.innerHTML = '';
            columns.forEach(c => {
                const h = document.createElement('div'); h.className = 'cell header'; h.textContent = c;
                if(c) h.id = `col-${c}`; grid.appendChild(h);
            });
            for (let r = 1; r <= rowsCount; r++) {
                const rh = document.createElement('div'); rh.className = 'cell header'; rh.textContent = r;
                rh.id = `row-${r}`; grid.appendChild(rh);
                for (let c = 1; c < columns.length; c++) {
                    const id = columns[c] + r;
                    const cell = document.createElement('div'); cell.className = 'cell';
                    cell.dataset.col = columns[c]; cell.dataset.row = r;
                    cellRefs[id] = cell;
                    cell.onmouseenter = () => { if(mode==='train'){ audio.hover(); updateDisplay(id, columns[c], r); } };
                    cell.onclick = () => { audio.click(); if(mode==='quiz') checkAnswer(id, cell); };
                    grid.appendChild(cell);
                }
            }
        }

        function setMode(m) {
            mode = m; clearInterval(timer); resetHighlights();
            document.getElementById('btn-train').classList.toggle('active', m==='train');
            document.getElementById('btn-quiz').classList.toggle('active', m==='quiz');
            document.getElementById('quiz-hud').style.visibility = m==='quiz' ? 'visible' : 'hidden';
            document.getElementById('timer-wrap').style.visibility = m==='quiz' ? 'visible' : 'hidden';
            
            if(m==='quiz') startQuizCountdown();
            else {
                document.getElementById('status-label').textContent = "مرر الفأرة فوق الخلايا";
                document.getElementById('target-view').textContent = "--";
            }
        }

        function startQuizCountdown() {
            const overlay = document.getElementById('count-overlay');
            const display = document.getElementById('count-display');
            overlay.classList.remove('hidden');
            let c = 3; display.textContent = c; audio.count();
            const intr = setInterval(() => {
                c--;
                if(c > 0) { display.textContent = c; audio.count(); }
                else {
                    clearInterval(intr); overlay.classList.add('hidden');
                    audio.go(); stage = 1; nextTask();
                }
            }, 1000);
        }

        function updateDisplay(id, c, r) {
            document.getElementById('target-view').textContent = id;
            document.querySelectorAll('.header').forEach(h => h.classList.remove('active-h'));
            if(c) document.getElementById(`col-${c}`).classList.add('active-h');
            if(r) document.getElementById(`row-${r}`).classList.add('active-h');
        }

        function nextTask() {
            resetHighlights();
            document.getElementById('status-label').textContent = "أوجد مكان الخلية:";
            document.getElementById('stage-num').textContent = stage;
            const c = columns[Math.floor(Math.random()*6)+1];
            const r = Math.floor(Math.random()*6)+1;
            targetId = c + r;
            document.getElementById('target-view').textContent = targetId;
            
            const bar = document.getElementById('timer-bar');
            bar.style.transition = 'none'; bar.style.width = '100%';
            setTimeout(() => { bar.style.transition = '12s linear'; bar.style.width = '0%'; }, 50);

            clearInterval(timer);
            timer = setInterval(() => finalize(false), 12000);
        }

        function checkAnswer(id, el) {
            if(id === targetId) {
                audio.win();
                if(stage < 3) { stage++; nextTask(); }
                else { finalize(true); }
            } else { finalize(false, el); }
        }

        function resetHighlights() {
            document.querySelectorAll('.cell').forEach(c => {
                c.classList.remove('fail-intersection', 'fail-target', 'fail-header', 'active-h');
            });
        }

        function showFailIntersection() {
            const targetCell = cellRefs[targetId];
            const col = targetCell.dataset.col;
            const row = targetCell.dataset.row;

            Object.values(cellRefs).forEach(c => {
                if(c.dataset.col === col || c.dataset.row === row) c.classList.add('fail-intersection');
            });
            document.getElementById(`col-${col}`).classList.add('fail-header');
            document.getElementById(`row-${row}`).classList.add('fail-header');
            targetCell.classList.add('fail-target');
        }

        function finalize(win, el) {
            clearInterval(timer);
            const bar = document.getElementById('timer-bar');
            bar.style.transition = 'none';

            if(!win) {
                audio.fail();
                showFailIntersection();
                if(el) el.classList.add('shake');
                document.getElementById('main-card').classList.add('shake');
            }

            setTimeout(() => {
                const ov = document.getElementById('end-overlay');
                ov.classList.remove('hidden');
                document.getElementById('end-title').textContent = win ? "🏆 فوز ساحق!" : "❌ انتهى التحدي";
                document.getElementById('end-title').style.color = win ? "var(--gold)" : "var(--danger)";
                document.getElementById('end-desc').textContent = win ? "أنت الآن بطل في إحداثيات الإكسل." : "المكان المحدد بالأحمر كان هو الإجابة الصحيحة.";
            }, win ? 300 : 6000); // تم تعديل وقت الانتظار عند الفشل إلى 6 ثوانٍ بناءً على طلبك
        }

        buildGrid();
    </script>
</body>
</html>
